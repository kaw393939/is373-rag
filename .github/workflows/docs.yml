name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      DOCS_BASE: /is373-rag/
      DOCS_ORIGIN: https://kaw393939.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the configured Pages address
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages.json" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPOSITORY/pages")
          if [ "$status" = 200 ]; then
            node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/pages.json","utf8")); const u=new URL(p.html_url); if(u.protocol!=="https:")throw Error("Expected HTTPS Pages URL"); const base=u.pathname.endsWith("/")?u.pathname:u.pathname+"/"; fs.appendFileSync(process.env.GITHUB_ENV,`DOCS_ORIGIN=${u.origin}\nDOCS_BASE=${base}\n`);'
          elif [ "$status" = 404 ]; then
            echo 'Pages is not enabled; build a preview at the default project path.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot inspect Pages address (HTTP $status)."
            exit 1
          fi
      - run: npm ci
      - name: Validate source ledger and planning traceability
        run: npm run check:plan
      - name: Run synthetic stream and publication examples
        run: npm run test:examples
      - name: Compile and run the Rust lease specification
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustc +1.90.0 --edition=2021 --test docs/examples/lease.rs -o "$RUNNER_TEMP/ordo-lease-tests"
          "$RUNNER_TEMP/ordo-lease-tests"
      - run: npm run build
      - name: Check generated paths, anchors and reference notices
        run: npm run check:pages
      - name: Verify navigation, concise entry pages and homepage
        run: node scripts/check-ia.mjs
      - name: Record verification scope
        run: |
          echo 'Verified: synthetic contracts, plan consistency, VitePress build, generated links/assets/anchors/sitemap, and documentation IA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These checks do not establish donor runtime behavior, research application readiness, accessibility certification or live Pages publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Package source checkout
        run: git bundle create "$RUNNER_TEMP/is373-rag.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: ${{ runner.temp }}/is373-rag.bundle
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Pages activation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output pages.json --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPOSITORY/pages")
          if [ "$status" != 200 ]; then
            echo "::error::Pages is not available (HTTP $status). Open Settings > Pages, choose GitHub Actions, then rerun Documentation on main. The static build artifact is available; no site was published."
            exit 1
          fi
          if [ "$(jq -r '.build_type' pages.json)" != workflow ]; then
            echo '::error::Choose GitHub Actions as the Pages source. Existing branch publishing has not been changed.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the actual public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs
      - name: Record publication outcome
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Publication job: %s\nPages action URL: %s\n' "$OUTCOME" "${PAGE_URL:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful build is not a live deployment. Success requires the public-site verification step.' >> "$GITHUB_STEP_SUMMARY"
