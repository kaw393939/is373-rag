name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: /is373-rag/
      DOCS_ORIGIN: https://kaw393939.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check documentation and project-path assets
        run: node scripts/check-pages.mjs
      - name: Package a portable source checkout
        run: git bundle create "$RUNNER_TEMP/is373-rag.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: ${{ runner.temp }}/is373-rag.bundle
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that Pages is enabled for Actions
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/pages")
          if [ "$status" = 404 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Pages has not been enabled. Select GitHub Actions in Settings > Pages, then rerun this workflow.'
          elif [ "$status" != 200 ]; then
            echo "::error::Unable to inspect Pages configuration (HTTP $status)."
            exit 1
          elif [ "$(jq -r '.build_type' pages.json)" != workflow ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Pages uses branch publishing. Select GitHub Actions in Settings > Pages, then rerun this workflow.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.readiness.outputs.enabled == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.readiness.outputs.enabled == 'true'
        id: deployment
      - name: Record publication status
        if: always()
        env:
          ENABLED: ${{ steps.readiness.outputs.enabled }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            printf 'Published documentation: %s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Documentation build completed; no live Pages deployment is claimed. Review the readiness step.' >> "$GITHUB_STEP_SUMMARY"
          fi
