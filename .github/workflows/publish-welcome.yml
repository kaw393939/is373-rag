name: Publish welcome image
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch Welcome workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-welcome
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dockerhub-release
    steps:
      - name: Verify selected build and public repository
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.build_run_id }}
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]+$ ]] || { echo 'Set the verified DOCKERHUB_USERNAME variable.'; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > selected.json
          jq -e --arg repo "$REPOSITORY" '.repository.full_name == $repo and .head_repository.full_name == $repo and .head_branch == "main" and .event == "push" and .conclusion == "success" and .path == ".github/workflows/welcome.yml"' selected.json
          sha=$(jq -er .head_sha selected.json)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          curl --fail --silent --show-error "https://hub.docker.com/v2/repositories/$NAMESPACE/is373-rag/" | jq -e '.is_private == false'
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: welcome-image
          path: candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and load the exact tested image
        env:
          SOURCE_SHA: ${{ steps.selected.outputs.source_sha }}
          RUN_ID: ${{ inputs.build_run_id }}
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" '.source_revision == $sha and .ci_run == $run and .platform == "linux/amd64"' candidate/receipt.json
          expected=$(jq -er '.archive_sha256 | select(test("^[a-f0-9]{64}$"))' candidate/receipt.json)
          echo "$expected  candidate/image.tar" | sha256sum -c -
          docker load -i candidate/image.tar
          test "$(docker image inspect ordo-rag-welcome:ci --format '{{.Id}}')" = "$(jq -er .image_id candidate/receipt.json)"
          docker tag ordo-rag-welcome:ci "$NAMESPACE/is373-rag:sha-$SOURCE_SHA"
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested candidate (no rebuild, no deployment)
        env:
          SOURCE_SHA: ${{ steps.selected.outputs.source_sha }}
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          image="$NAMESPACE/is373-rag:sha-$SOURCE_SHA"
          if docker manifest inspect "$image" > existing.json 2>/dev/null; then
            test "$(jq -er .config.digest existing.json)" = "$(jq -er .image_id candidate/receipt.json)" || { echo 'Refusing to replace a different published candidate at this tag.'; exit 1; }
          fi
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > candidate/registry-digests.json
          echo "Published candidate $image. Use its registry digest for both environments; this workflow did not deploy a server." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-publication-receipt
          path: |
            candidate/receipt.json
            candidate/registry-digests.json
